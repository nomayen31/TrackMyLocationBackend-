# Render Blueprint — deploys the Trip Tracker backend as a persistent web
# service (required for Socket.IO / WebSockets).
#
# Usage: Render Dashboard -> New -> Blueprint -> select this repo.
# Values marked `sync: false` are secrets you must fill in the dashboard.
services:
  - type: web
    name: trackmylocation-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Pick the region closest to your users (singapore is nearest to South Asia).
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # --- secrets: set these in the Render dashboard ---
      # Neon PostgreSQL connection string (include ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # A long random string, e.g. `openssl rand -hex 32`
      - key: BETTER_AUTH_SECRET
        sync: false
      # This service's own public URL, e.g. https://trackmylocation-api.onrender.com
      - key: BETTER_AUTH_URL
        sync: false
      # The deployed frontend origin, e.g. https://your-app.vercel.app
      - key: CLIENT_URL
        sync: false
      # Optional extra allowed origins (comma separated), e.g. Vercel previews
      - key: CORS_ORIGINS
        sync: false
      # LiveKit (group voice rooms)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
